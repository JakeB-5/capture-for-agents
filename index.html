<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>여기요!!</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="banner" class="banner hidden"></div>

    <!-- Capture view: shown after a successful screencapture -->
    <main id="capture-view" class="view hidden">
      <div class="canvas-wrap">
        <canvas id="annotation-canvas" tabindex="-1"></canvas>
        <div id="note-popover" class="note-popover hidden">
          <textarea id="note-textarea" rows="2" placeholder="노트 (선택)"></textarea>
          <p class="popover-hint">Enter 확정 · ⇧Enter 줄바꿈 · 빈 채로 Enter = 생략</p>
        </div>
      </div>
      <footer class="hint-bar">
        <div class="hint-left">
          <span class="tool-indicator">
            <button class="tool-btn active" data-tool="smart">자동</button>
            <button class="tool-btn" data-tool="point">점</button>
            <button class="tool-btn" data-tool="rect">사각</button>
            <button class="tool-btn" data-tool="arrow">화살</button>
          </span>
          <input
            id="context-input"
            class="context-input"
            type="text"
            placeholder="context (선택) — 전체 상황 한 줄"
          />
        </div>
        <span id="hint-error" class="hint-error hidden"></span>
        <span class="keys">클릭=마커 · 드래그=사각형 · ⇧드래그=화살표 · <kbd>1/2/3</kbd> 도구 · <kbd>⌘⏎</kbd> 복사 · <kbd>⌘Z</kbd> 언두 · <kbd>⌫</kbd> 삭제 · <kbd>Esc</kbd> 취소</span>
      </footer>
    </main>

    <!-- TCC onboarding: shown when screencapture fails with a permission error -->
    <main id="onboarding-view" class="view hidden">
      <h1>화면 기록 권한이 필요합니다</h1>
      <p>
        macOS가 화면 캡처를 차단했습니다. 시스템 설정에서
        <strong>화면 기록</strong> 권한을 허용해 주세요.
      </p>
      <p class="small">
        개발 모드에서는 권한이 이 앱이 아니라 <strong>터미널/IDE</strong>에
        귀속됩니다 — 실행 중인 터미널 앱에 권한을 부여하세요.
      </p>
      <div class="row">
        <button id="open-settings">시스템 설정 열기</button>
        <button id="test-capture">테스트 캡처로 확인</button>
      </div>
      <p id="onboarding-status" class="status"></p>
      <footer class="hint-bar">
        <span class="keys"><kbd>Esc</kbd> 닫기</span>
      </footer>
    </main>

    <!-- Settings view: shown when tray "Settings…" is clicked -->
    <main id="settings-view" class="view hidden">
      <div class="settings-form">
        <div class="form-row">
          <label for="shortcut-input">단축키</label>
          <input
            id="shortcut-input"
            class="shortcut-input"
            type="text"
            readonly
            placeholder="클릭 후 단축키 입력"
          />
        </div>
        <div class="form-row">
          <label for="capture-dir-input">저장 경로</label>
          <input id="capture-dir-input" type="text" placeholder="~/.capnote" />
        </div>
        <div class="form-row">
          <label for="retention-days-input">보존 기간(일)</label>
          <input id="retention-days-input" type="number" min="1" />
        </div>
        <div class="form-row">
          <label for="retention-max-input">최대 보관 개수</label>
          <input id="retention-max-input" type="number" min="10" />
        </div>
        <div class="form-actions">
          <span id="settings-status" class="settings-status"></span>
          <div class="form-btns">
            <button id="settings-cancel" class="btn-secondary">취소</button>
            <button id="settings-save" class="btn-primary">저장</button>
          </div>
        </div>
      </div>
      <footer class="hint-bar">
        <span class="keys"><kbd>Esc</kbd> 닫기</span>
      </footer>
    </main>
  </body>
</html>
