<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 460" role="img" aria-label="시스템 아키텍처" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="880" height="460" fill="#ffffff"/>
      <defs>
        <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
        </marker>
      </defs>
      <!-- app container -->
      <rect x="30" y="30" width="540" height="264" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="300" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Capture for Agents.app — Tauri v2 (바이너리 ~10MB · 상주 ~30MB)</text>

      <!-- rust shell -->
      <rect x="50" y="74" width="240" height="200" rx="8" fill="#eff6ff" stroke="#2563eb"/>
      <text x="170" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Rust 얇은 셸</text>
      <text x="66" y="126" font-size="12" fill="#374151">· 트레이(메뉴바) 상주</text>
      <text x="66" y="148" font-size="12" fill="#374151">· global-shortcut (⌥⇧C)</text>
      <text x="66" y="170" font-size="12" fill="#374151">· clipboard-manager (텍스트 전용)</text>
      <text x="66" y="192" font-size="12" fill="#374151">· screencapture 프로세스 스폰</text>
      <text x="66" y="214" font-size="12" fill="#374151">· frontmost 앱 기억·복귀</text>
      <text x="66" y="236" font-size="12" fill="#374151">· TCC 온보딩 (픽셀 검증)</text>

      <!-- ts annotator -->
      <rect x="310" y="74" width="240" height="200" rx="8" fill="#fffbeb" stroke="#d97706"/>
      <text x="430" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">TS + Canvas 2D 어노테이터</text>
      <text x="430" y="118" text-anchor="middle" font-size="11" fill="#6b7280">(제품의 95%)</text>
      <text x="326" y="144" font-size="12" fill="#374151">· 스마트 툴 3종 + 번호 시퀀스</text>
      <text x="326" y="166" font-size="12" fill="#374151">· 인라인 노트 팝오버</text>
      <text x="326" y="188" font-size="12" fill="#374151">· 번인 렌더러 (배지 오프셋+리더)</text>
      <text x="326" y="210" font-size="12" fill="#374151">· 1568px 다운스케일 파이프라인</text>
      <text x="326" y="232" font-size="12" fill="#374151">· CapNote v1 인코더</text>

      <!-- screencapture -->
      <rect x="30" y="370" width="250" height="66" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
      <text x="155" y="396" text-anchor="middle" font-size="13" font-weight="600" class="mono" fill="#1f2937">/usr/sbin/screencapture</text>
      <text x="155" y="418" text-anchor="middle" font-size="11" class="mono" fill="#6b7280">-i -x -o -t png &lt;tmpfile&gt;</text>

      <!-- storage -->
      <rect x="330" y="370" width="230" height="66" rx="8" fill="#ecfdf5" stroke="#059669"/>
      <text x="445" y="396" text-anchor="middle" font-size="13" font-weight="600" class="mono" fill="#1f2937">~/.capnote/</text>
      <text x="445" y="418" text-anchor="middle" font-size="11" fill="#6b7280">YYYY-MM-DD-HHMMSS.png · 14일/500개 GC</text>

      <!-- terminal -->
      <rect x="650" y="90" width="210" height="184" rx="8" fill="#ecfdf5" stroke="#059669"/>
      <text x="755" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">터미널의 Claude Code</text>
      <text x="666" y="146" font-size="12" fill="#374151">· ⌘V로 CapNote 텍스트 수신</text>
      <text x="666" y="168" font-size="12" fill="#374151">· image: 경로를 Read로 열람</text>
      <text x="666" y="190" font-size="12" fill="#374151">· [n] 번호로 두 채널 조인</text>
      <text x="666" y="212" font-size="12" fill="#374151">· 지목된 위치의 코드 수정</text>

      <!-- arrows -->
      <line x1="140" y1="274" x2="140" y2="366" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr5)"/>
      <text x="134" y="308" text-anchor="end" font-size="11" fill="#6b7280">스폰</text>
      <text x="134" y="324" text-anchor="end" font-size="11" fill="#6b7280">(드래그/창 선택은</text>
      <text x="134" y="340" text-anchor="end" font-size="11" fill="#6b7280">-i가 제공)</text>

      <line x1="230" y1="366" x2="392" y2="278" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr5)"/>
      <text x="330" y="338" text-anchor="middle" font-size="11" fill="#6b7280">임시 PNG (ESC = 파일 미생성)</text>

      <line x1="470" y1="274" x2="470" y2="366" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr5)"/>
      <text x="478" y="326" font-size="11" fill="#6b7280">번인 PNG 저장</text>

      <line x1="570" y1="160" x2="646" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr5)"/>
      <text x="608" y="146" text-anchor="middle" font-size="11" fill="#6b7280">클립보드 → ⌘V</text>

      <polyline points="560,403 755,403 755,278" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr5)"/>
      <text x="768" y="348" font-size="11" fill="#6b7280">Read 도구로 열람</text>
    </svg>
