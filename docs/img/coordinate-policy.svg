<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 330" role="img" aria-label="Coordinate space and downscale policy" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="880" height="330" fill="#ffffff"/>
      <defs>
        <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
        </marker>
      </defs>
      <!-- original -->
      <text x="180" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Retina @2x original — 2492x1640</text>
      <rect x="30" y="68" width="300" height="197" fill="#eff6ff" stroke="#2563eb"/>
      <circle cx="99" cy="97" r="4" fill="#9ca3af"/>
      <text x="110" y="93" font-size="11" fill="#9ca3af">(576,240) @2x</text>
      <text x="110" y="107" font-size="11" fill="#9ca3af">this coordinate is never exposed</text>
      <text x="180" y="248" text-anchor="middle" font-size="12" fill="#6b7280">raw physical screen pixels</text>

      <!-- arrow 1 -->
      <line x1="334" y1="166" x2="424" y2="166" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr4)"/>
      <text x="379" y="146" text-anchor="middle" font-size="11" fill="#6b7280">downscale ÷2</text>
      <text x="379" y="160" text-anchor="middle" font-size="11" fill="#6b7280">then burn-in</text>

      <!-- saved -->
      <text x="505" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">saved file 1246x820</text>
      <text x="505" y="128" text-anchor="middle" font-size="11" fill="#6b7280">long edge ≤ 1568px · PNG</text>
      <rect x="430" y="138" width="150" height="99" fill="#ecfdf5" stroke="#059669"/>
      <circle cx="465" cy="152" r="4" fill="#d97706"/>
      <text x="474" y="156" font-size="11" fill="#b45309">[1] (288,120)</text>
      <text x="505" y="252" text-anchor="middle" font-size="11" fill="#6b7280">size: 1246x820 = the coordinate space</text>

      <!-- arrow 2 -->
      <line x1="584" y1="166" x2="674" y2="166" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr4)"/>
      <text x="629" y="146" text-anchor="middle" font-size="11" fill="#6b7280">≤ 1568 → API</text>
      <text x="629" y="160" text-anchor="middle" font-size="11" fill="#6b7280">doesn't resize</text>

      <!-- model view -->
      <text x="755" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">pixels the model sees</text>
      <text x="755" y="128" text-anchor="middle" font-size="11" fill="#6b7280">still 1246x820</text>
      <rect x="680" y="138" width="150" height="99" fill="#fffbeb" stroke="#d97706"/>
      <circle cx="715" cy="152" r="4" fill="#d97706"/>
      <text x="724" y="156" font-size="11" fill="#b45309">[1] (288,120)</text>

      <text x="440" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">text coord (288,120) = saved-file pixel = pixel the model sees — exactly 1:1</text>
      <text x="440" y="314" text-anchor="middle" font-size="12" fill="#6b7280">small crops stay native @2x · no upscaling · no JPEG (artifacts smear 1px detail)</text>
    </svg>
