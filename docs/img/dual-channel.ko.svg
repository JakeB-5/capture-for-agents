<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 340" role="img" aria-label="CapNote 이중 채널 구조" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="880" height="340" fill="#ffffff"/>
      <defs>
        <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
        </marker>
      </defs>
      <!-- left: one paste -->
      <rect x="20" y="135" width="150" height="72" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
      <text x="95" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">⌘V 한 번</text>
      <text x="95" y="185" text-anchor="middle" font-size="12" fill="#6b7280">텍스트 한 덩어리</text>

      <!-- split lines -->
      <line x1="170" y1="160" x2="246" y2="95" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr3)"/>
      <line x1="170" y1="182" x2="246" y2="245" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr3)"/>

      <!-- visual channel -->
      <rect x="250" y="40" width="315" height="108" rx="8" fill="#fffbeb" stroke="#d97706"/>
      <text x="266" y="66" font-size="14" font-weight="600" fill="#1f2937">시각 채널 — 번인된 PNG 파일</text>
      <text x="266" y="88" font-size="12" class="mono" fill="#6b7280">~/.capnote/2026-07-02-164812.png</text>
      <text x="266" y="108" font-size="12" fill="#6b7280">텍스트 속 경로를 보고 Read 도구로 열람</text>
      <circle cx="278" cy="128" r="9" fill="#d97706"/>
      <text x="278" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
      <circle cx="302" cy="128" r="9" fill="#d97706"/>
      <text x="302" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
      <text x="320" y="132" font-size="12" fill="#6b7280">번호 배지가 이미지에 새겨져 있음</text>

      <!-- semantic channel -->
      <rect x="250" y="192" width="315" height="108" rx="8" fill="#eff6ff" stroke="#2563eb"/>
      <text x="266" y="218" font-size="14" font-weight="600" fill="#1f2937">의미 채널 — CapNote 텍스트</text>
      <text x="266" y="240" font-size="12" class="mono" fill="#6b7280">[n] point/rect/arrow + (x,y) 좌표</text>
      <text x="266" y="260" font-size="12" fill="#6b7280">번호별 노트(무엇이 문제고 어떻게 고칠지)</text>
      <text x="266" y="280" font-size="12" fill="#6b7280">클립보드로 즉시 도착 — 정규식으로 파싱 가능</text>

      <!-- join -->
      <line x1="565" y1="94" x2="656" y2="158" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr3)"/>
      <line x1="565" y1="246" x2="656" y2="184" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr3)"/>
      <rect x="612" y="156" width="34" height="28" rx="6" fill="#ffffff" stroke="#059669"/>
      <text x="629" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">[n]</text>
      <text x="629" y="205" text-anchor="middle" font-size="11" fill="#059669">번호 = join key</text>

      <!-- agent -->
      <rect x="672" y="115" width="190" height="112" rx="8" fill="#ecfdf5" stroke="#059669"/>
      <text x="767" y="145" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">에이전트</text>
      <text x="767" y="170" text-anchor="middle" font-size="12" fill="#6b7280">두 채널을 번호로 결합</text>
      <text x="767" y="190" text-anchor="middle" font-size="12" fill="#6b7280">좌표 해석 정밀도에</text>
      <text x="767" y="208" text-anchor="middle" font-size="12" fill="#6b7280">덜 의존 (이중 앵커링)</text>
    </svg>
