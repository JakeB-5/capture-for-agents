<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 270" role="img" aria-label="Full usage loop diagram" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR',sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><rect width="880" height="270" fill="#ffffff"/>
      <defs>
        <marker id="arr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
        </marker>
      </defs>
      <!-- Row 1 -->
      <rect x="12" y="34" width="186" height="62" rx="8" fill="#eff6ff" stroke="#2563eb"/>
      <text x="105" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">⌥⇧C</text>
      <text x="105" y="80" text-anchor="middle" font-size="12" fill="#6b7280">global shortcut (configurable)</text>

      <line x1="200" y1="65" x2="230" y2="65" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr1)"/>

      <rect x="234" y="34" width="186" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
      <text x="327" y="60" text-anchor="middle" font-size="13" font-weight="600" class="mono" fill="#1f2937">screencapture -i</text>
      <text x="327" y="80" text-anchor="middle" font-size="12" fill="#6b7280">drag a region / pick a window</text>

      <line x1="422" y1="65" x2="452" y2="65" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr1)"/>

      <rect x="456" y="34" width="186" height="62" rx="8" fill="#fffbeb" stroke="#d97706"/>
      <text x="549" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Annotation window</text>
      <text x="549" y="80" text-anchor="middle" font-size="12" fill="#6b7280">click → type → Enter, repeat</text>

      <line x1="644" y1="65" x2="674" y2="65" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr1)"/>

      <rect x="678" y="34" width="188" height="62" rx="8" fill="#eff6ff" stroke="#2563eb"/>
      <text x="772" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">⌘Enter</text>
      <text x="772" y="80" text-anchor="middle" font-size="12" fill="#6b7280">one-shot commit (burn·save·copy)</text>

      <!-- elbow connector row1 -> row2 -->
      <polyline points="772,96 772,128 105,128 105,158" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr1)"/>
      <text x="438" y="122" text-anchor="middle" font-size="12" fill="#6b7280">window closes → focus returns to the previous app</text>

      <!-- Row 2 -->
      <rect x="12" y="162" width="186" height="62" rx="8" fill="#eff6ff" stroke="#2563eb"/>
      <text x="105" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Clipboard</text>
      <text x="105" y="208" text-anchor="middle" font-size="12" fill="#6b7280">CapNote text only (no image)</text>

      <line x1="200" y1="193" x2="286" y2="193" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr1)"/>

      <rect x="290" y="162" width="186" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
      <text x="383" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">⌘V in the terminal</text>
      <text x="383" y="208" text-anchor="middle" font-size="12" fill="#6b7280">the only user action left</text>

      <line x1="478" y1="193" x2="562" y2="193" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr1)"/>

      <rect x="566" y="162" width="300" height="62" rx="8" fill="#ecfdf5" stroke="#059669"/>
      <text x="716" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Agent</text>
      <text x="716" y="208" text-anchor="middle" font-size="12" fill="#6b7280">parses the text, opens the image via Read</text>
    </svg>
